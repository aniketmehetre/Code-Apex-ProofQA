[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofqa"
version = "0.1.0"
description = "ProofQA 2.0: The Verification-Native Autonomous QA Engineer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "sqlmodel>=0.0.16",
    "playwright>=1.42.0",
    "networkx>=3.2.1",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "litellm>=1.30.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "ruff>=0.3.0",
]

[project.scripts]
proofqa = "proofqa.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["proofqa*", "proofbench*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
